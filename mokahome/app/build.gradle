plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mokano.mokahome'
    compileSdk 35

    defaultConfig {
        applicationId "com.mokano.mokahome"
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName "0.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
