plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mokano.mokahome'
    compileSdk 35

    defaultConfig {
        applicationId "com.mokano.mokahome"
        minSdk 23
        targetSdk 28
        versionCode 10
        versionName "1.0"
    }

    signingConfigs {
        debug {
            def stableKeystore = System.getenv("MOKAHOME_KEYSTORE") ?: "/home/runner/.android/debug.keystore"
            storeFile file(stableKeystore)
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}