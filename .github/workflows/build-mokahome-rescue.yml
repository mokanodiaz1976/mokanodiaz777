name: Build MokaHome Rescue APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mokahome-rescue/**'
      - '.github/workflows/build-mokahome-rescue.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: mokahome-rescue
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MokaHome-Rescue-APK
          path: mokahome-rescue/app/build/outputs/apk/debug/app-debug.apk
