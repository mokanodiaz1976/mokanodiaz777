name: Build MokaHome APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mokahome/**'
      - '.github/workflows/build-mokahome.yml'
  pull_request:
    paths:
      - 'mokahome/**'
      - '.github/workflows/build-mokahome.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mokahome-debug-keystore-v1
      - name: Recover cached signing key location
        run: |
          mkdir -p "$HOME/.android"
          echo "HOME=$HOME"
          echo "Searching cached debug.keystore..."
          find /home/runner -type f -name debug.keystore -print 2>/dev/null || true
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            FOUND="$(find /home/runner -type f -name debug.keystore ! -path "$HOME/.android/debug.keystore" -print -quit 2>/dev/null || true)"
            if [ -n "$FOUND" ]; then
              echo "Recovering cached key from $FOUND"
              cp "$FOUND" "$HOME/.android/debug.keystore"
            fi
          fi
      - name: Ensure stable debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256:|Valid from:' || true
      - name: Android 9 compatibility patch
        run: |
          sed -i 's/Settings.ACTION_NOTIFICATION_SETTINGS/"android.settings.NOTIFICATION_SETTINGS"/g' mokahome/app/src/main/java/com/mokano/mokahome/MainActivityV4.java
      - name: Build APK
        working-directory: mokahome
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MokaHome-APK
          path: mokahome/app/build/outputs/apk/debug/app-debug.apk
