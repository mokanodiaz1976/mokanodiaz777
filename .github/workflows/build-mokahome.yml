name: Build MokaHome 1.0

on:
  workflow_dispatch:
  push:
    branches:
      - mokahome-v1
    paths:
      - 'mokahome/**'
      - '.github/workflows/build-mokahome.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore MokaHome 1.x signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: mokahome-v1-signing-20260909

      - name: Ensure stable 1.x signing key
        run: |
          mkdir -p /home/runner/.android
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=MokaHome 1.x,O=Mokano,C=DO" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "MokaHome 1.x signer:"
          keytool -list -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | head -n1

      - name: Android 9 and Java compatibility patches
        run: |
          sed -i 's/Settings.ACTION_NOTIFICATION_SETTINGS/"android.settings.NOTIFICATION_SETTINGS"/g' mokahome/app/src/main/java/com/mokano/mokahome/MainActivityV4.java

          FILE=mokahome/app/src/main/java/com/mokano/mokahome/MokaHomeAppV1.java
          sed -i 's/private int bg(Context c)/static int bg(Context c)/' "$FILE"
          sed -i 's/private int fg(Context c)/static int fg(Context c)/' "$FILE"
          sed -i 's/private int muted(Context c)/static int muted(Context c)/' "$FILE"
          sed -i 's/private int dp(Context c,int v)/static int dp(Context c,int v)/' "$FILE"
          sed -i 's/private SharedPreferences prefs(Context c)/static SharedPreferences prefs(Context c)/' "$FILE"
          sed -i 's/private void toast(Context c,String s)/static void toast(Context c,String s)/' "$FILE"
          sed -i 's/private void showDialog(Dialog d, Context c, int width, int height)/static void showDialog(Dialog d, Context c, int width, int height)/' "$FILE"

          UPD=mokahome/app/src/main/java/com/mokano/mokahome/UpdateManager.java
          sed -i 's/int localCode = BuildConfig.VERSION_CODE;/int localCode = 10;/' "$UPD"
          sed -i 's/"MokaHome\/"+BuildConfig.VERSION_NAME/"MokaHome\/1.0"/g' "$UPD"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('mokahome/migrator/src/main/java/com/mokano/mokahome/migrator/MigratorActivity.java')
          s = p.read_text()
          needle = '                script.append("pm uninstall $PKG >/data/local/tmp/mokahome-old-uninstall.log 2>&1 || pm uninstall --user 0 $PKG >/data/local/tmp/mokahome-old-uninstall.log 2>&1\\n");'
          insert = '''                // Fail-safe: reactiva cualquier HOME alternativo antes de retirar la versión vieja.\n                // Si la instalación nueva fallara, la caja nunca queda sin launcher.\n                for (String pck : otherLaunchers) {\n                    if (safePackage(pck)) script.append("pm enable --user 0 ").append(pck).append(" >/dev/null 2>&1\\n");\n                }\n''' + needle
          if needle not in s:
              raise SystemExit('No se encontró punto de inserción fail-safe')
          p.write_text(s.replace(needle, insert, 1))
          PY

      - name: Build MokaHome 1.0
        working-directory: mokahome
        run: gradle :app:assembleDebug

      - name: Embed MokaHome inside migrator
        run: |
          mkdir -p mokahome/migrator/src/main/assets
          cp mokahome/app/build/outputs/apk/debug/app-debug.apk mokahome/migrator/src/main/assets/MokaHome-v1.0.apk

      - name: Build one-click migrator
        working-directory: mokahome
        run: gradle :migrator:assembleDebug

      - name: Show APK certificate
        run: |
          keytool -printcert -jarfile mokahome/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256:' | head -n1

      - uses: actions/upload-artifact@v4
        with:
          name: MokaHome-v1.0-APK
          path: mokahome/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MokaHome-v1.0-Migrator
          path: mokahome/migrator/build/outputs/apk/debug/migrator-debug.apk
