name: Build MokaHome Update Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'mokahome-updater/**'
      - '.github/workflows/build-mokahome-updater.yml'

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download verified MokaHome 0.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mokahome-updater/app/src/main/res/raw
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/mokanodiaz1976/mokanodiaz777/actions/artifacts/10123982957/zip" \
            -o /tmp/mokahome-v06.zip
          unzip -p /tmp/mokahome-v06.zip app-debug.apk > mokahome-updater/app/src/main/res/raw/mokahome_v06.apk
          test -s mokahome-updater/app/src/main/res/raw/mokahome_v06.apk

      - name: Verify embedded MokaHome signer
        run: |
          EXPECTED="B1:B3:A0:7C:48:70:61:39:71:14:B4:A6:CE:38:71:AA:92:C8:B7:8C:9F:AF:34:1A:A7:8B:CD:DA:74:DB:46:79"
          ACTUAL=$(keytool -printcert -jarfile mokahome-updater/app/src/main/res/raw/mokahome_v06.apk 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n1 | tr -d '\r')
          echo "Embedded signer: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build updater
        working-directory: mokahome-updater
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MokaHome-Update-Bridge
          path: mokahome-updater/app/build/outputs/apk/debug/app-debug.apk
